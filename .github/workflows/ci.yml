name: CI

on:
  push:
    branches: ["main/1.0"]
  pull_request:
    branches: ["main/1.0"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config git \
            libqpid-proton-cpp12-dev \
            libqpid-proton-dev \
            libtinyxml2-dev \
            libsqlite3-dev \
            libfmt-dev

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DFETCHCONTENT_QUIET=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        # Skip WhisperTranscriber tests — model file not present in CI
        # Config, VAD, Resampler, TranscriptStore tests run without model
        run: ctest --test-dir build --output-on-failure -V --timeout 60 \
               -E "Whisper"
